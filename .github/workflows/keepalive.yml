name: Animalitos Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        shell: bash
        run: |
          bash .github/scripts/wake_backend.sh
