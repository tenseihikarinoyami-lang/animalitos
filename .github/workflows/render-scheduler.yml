name: Animalitos Render Scheduler

on:
  schedule:
    - cron: "5,15,25,35,45,55 * * * *"
    - cron: "5 12 * * *"
    - cron: "35 13 * * *"
    - cron: "35 17 * * *"
    - cron: "15 1 * * *"
    - cron: "10 8 * * 0"
  workflow_dispatch:
    inputs:
      target:
        description: "Tarea a ejecutar"
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - possible-results
          - today-analysis-opening
          - today-analysis-midday
          - daily-summary
          - weekly-backfill

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'refresh') || (github.event_name == 'schedule' && github.event.schedule == '5,15,25,35,45,55 * * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Queue refresh
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 60 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/refresh"

  possible-results:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'possible-results') || (github.event_name == 'schedule' && github.event.schedule == '5 12 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Trigger possible results summary
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 60 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/possible-results"

  daily-summary:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'daily-summary') || (github.event_name == 'schedule' && github.event.schedule == '15 1 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Trigger daily summary
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 60 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/daily-summary"

  today-analysis-opening:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'today-analysis-opening') || (github.event_name == 'schedule' && github.event.schedule == '35 13 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Trigger opening today analysis
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 60 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/today-analysis?phase=apertura"

  today-analysis-midday:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'today-analysis-midday') || (github.event_name == 'schedule' && github.event.schedule == '35 17 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Trigger midday today analysis
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 60 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/today-analysis?phase=media-jornada"

  weekly-backfill:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'weekly-backfill') || (github.event_name == 'schedule' && github.event.schedule == '10 8 * * 0') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wake or recover backend
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.ANIMALITOS_RENDER_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/wake_backend.sh

      - name: Trigger weekly recovery backfill
        env:
          BACKEND_URL: ${{ secrets.ANIMALITOS_BACKEND_URL }}
          SCHEDULER_TOKEN: ${{ secrets.ANIMALITOS_SCHEDULER_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 2 --retry-delay 8 --retry-all-errors --max-time 90 \
            -X POST \
            -H "X-Scheduler-Token: ${SCHEDULER_TOKEN}" \
            "${BACKEND_URL}/api/internal/scheduler/weekly-backfill"
